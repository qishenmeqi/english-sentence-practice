<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ef">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="句子练习">
<title>英语句子练习</title>
<style>
  :root{
    --bg:#f4f3ef; --card:#ffffff; --fg:#1c1d1a; --muted:#70736c; --border:#e3e2dc;
    --accent:#2f6b4f; --accent-fg:#ffffff; --ring:rgba(47,107,79,.16);
    --ok:#1f7a4d; --ok-bg:#e8f3ed; --bad:#a83a32; --bad-bg:#fbebea;
    --chip:#eceae3; --chip-fg:#4a4d46;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141618; --card:#1c1f22; --fg:#e9e8e4; --muted:#9a9e99; --border:#2c3033;
      --accent:#63b58c; --accent-fg:#0d1a13; --ring:rgba(99,181,140,.22);
      --ok:#74c99c; --ok-bg:#1b2b23; --bad:#e2837a; --bad-bg:#2c1e1d;
      --chip:#24282c; --chip-fg:#c3c7c1;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--fg);
    min-height:100vh; display:flex; justify-content:center;
    padding:18px 16px calc(40px + env(safe-area-inset-bottom, 0px)); -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:640px; display:flex; flex-direction:column; gap:14px}
  header{display:flex; flex-direction:column; gap:10px}
  .topline{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  .brand{font-size:15px; font-weight:600; letter-spacing:.02em}
  .counter{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .progress{height:5px; background:var(--chip); border-radius:99px; overflow:hidden}
  .progress i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .3s ease}
  .topbar{display:flex; gap:8px}
  .toolbar{flex:0 0 auto; padding:10px 14px; font-size:14px}
  .toolbar.grow{flex:1; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:10px}
  .chev{font-size:11px; opacity:.7; margin-left:8px}
  .home{display:flex; flex-direction:column; gap:22px; justify-content:center; min-height:calc(100vh - 90px)}
  .home[hidden]{display:none}
  .home-title{font-size:26px; font-weight:700; text-align:center}
  .home-sub{font-size:14px; color:var(--muted); text-align:center; margin-top:-12px}
  .home-cards{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .home-card{
    aspect-ratio:1/1; border:1px solid var(--border); border-radius:26px; background:var(--card);
    color:var(--fg); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; cursor:pointer; box-shadow:var(--shadow); transition:.18s; font:inherit;
  }
  .home-card:hover{transform:translateY(-3px); border-color:var(--accent)}
  .home-emoji{font-size:58px; line-height:1}
  .home-name{font-size:38px; font-weight:700; letter-spacing:.04em}
  .home-desc{font-size:13px; color:var(--muted)}
  @media (max-width:560px){
    .home{min-height:auto; padding:24px 0}
    .home-cards{grid-template-columns:1fr}
    .home-card{aspect-ratio:auto; padding:34px 20px}
    .home-name{font-size:30px}
  }
  .subjectbar{display:flex; justify-content:flex-start; background:var(--chip); border-radius:99px; padding:3px; gap:2px}
  .subjectbar[hidden]{display:none !important}
  .subjectbar .subject{flex:0 0 auto; padding:8px 16px}
  .app[hidden]{display:none !important}
  .home[hidden]{display:none !important}
  .subject{
    flex:1; border:none; background:transparent; color:var(--chip-fg);
    font:inherit; font-size:14px; font-weight:600; padding:8px 10px; border-radius:99px;
    cursor:pointer; transition:.15s;
  }
  .subject.active{background:var(--card); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .app{display:flex; flex-direction:column; gap:14px}
  .app[hidden]{display:none}
  .zh-options{display:flex; flex-direction:column; gap:10px}
  .zh-option{
    text-align:left; padding:14px 16px; border:1.5px solid var(--border);
    background:transparent; color:var(--fg); border-radius:12px; font-size:16px; line-height:1.45;
    cursor:pointer; transition:.15s;
  }
  .zh-option.selected{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  .zh-option.ok{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
  .zh-option.bad{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
  .zh-prompt{font-size:clamp(17px,4vw,22px); font-weight:600; line-height:1.7; margin:0 0 16px; white-space:pre-line}
  .zh-input{
    width:100%; font:inherit; font-size:17px; line-height:1.7; color:var(--fg);
    background:transparent; border:1.5px solid var(--border); border-radius:12px;
    padding:12px 14px; outline:none; resize:vertical; min-height:86px;
    transition:border-color .15s, box-shadow .15s;
  }
  .zh-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  .zh-input:read-only{opacity:.85}
  .build-answer{
    min-height:54px; border:1.5px dashed var(--border); border-radius:12px;
    padding:8px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  }
  .build-bank{display:flex; flex-wrap:wrap; gap:8px}
  .wordchip{
    font:inherit; font-size:17px; padding:8px 14px; border-radius:10px;
    border:1.5px solid var(--border); background:var(--card); color:var(--fg);
    cursor:pointer; transition:.15s;
  }
  .build-answer .wordchip{border-color:var(--accent); background:var(--accent); color:var(--accent-fg)}
  .chip{
    flex:0 0 auto; border:1px solid transparent; background:var(--chip); color:var(--chip-fg);
    font:inherit; font-size:13px; padding:7px 12px; border-radius:99px; cursor:pointer;
    transition:.15s; white-space:nowrap;
  }
  .chip:hover{filter:brightness(.97)}
  .chip.active{background:var(--accent); color:var(--accent-fg); font-weight:600}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:26px 22px; box-shadow:var(--shadow); min-height:340px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .catline{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 10px}
  .catname{font-size:13px; font-weight:600; color:var(--accent); letter-spacing:.02em}
  .cathint{font-size:12px; color:var(--muted)}
  .cn{
    font-size:clamp(21px,5vw,28px); font-weight:600; line-height:1.5;
    margin:0 0 20px; letter-spacing:.01em;
  }
  .boxes{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px}
  .box{
    font:inherit; font-size:17px; text-align:center; height:46px;
    border:1.5px solid var(--border); border-radius:10px; background:var(--card); color:var(--fg);
    outline:none; padding:0 6px; min-width:46px; transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .box:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  .box.ok{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
  .box.bad{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
  .box:read-only{cursor:default}
  .tips{font-size:12px; color:var(--muted); margin:2px 0 0}
  .actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  button{font:inherit; cursor:pointer; border-radius:12px; padding:11px 18px; border:1px solid transparent; transition:.15s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45; cursor:default}
  .primary{background:var(--accent); color:var(--accent-fg); font-weight:600; flex:1; min-width:120px}
  .ghost{background:transparent; border-color:var(--border); color:var(--muted)}
  .ghost:hover{color:var(--fg); border-color:var(--muted)}
  .feedback{margin-top:16px; font-size:15px; line-height:1.6}
  .feedback:empty{display:none}
  .fb-ok{color:var(--ok); font-weight:600; animation:pop .18s ease}
  .fb-bad{color:var(--bad); font-weight:600; animation:pop .18s ease}
  .answer{font-size:18px; color:var(--fg); font-weight:600; margin:6px 0 0; line-height:1.5}
  @keyframes pop{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
  footer{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .stats{font-variant-numeric:tabular-nums}
  .tools{display:flex; gap:8px; flex-wrap:wrap}
  .small{padding:8px 13px; font-size:13px}
  .done{text-align:center; padding:14px 8px}
  .done .emoji{font-size:44px; margin-bottom:8px}
  .done h2{margin:0 0 10px; font-size:23px}
  .done p{margin:0; color:var(--muted); font-size:15px; line-height:1.6}
  .done .actions{justify-content:center; margin-top:24px}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,12px);
    background:var(--fg); color:var(--bg); font-size:14px; padding:10px 18px; border-radius:99px;
    opacity:0; pointer-events:none; transition:.25s; z-index:9;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .sheet{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.42)}
  .sheet-panel{
    position:relative; width:100%; max-width:640px; background:var(--card); color:var(--fg);
    border:1px solid var(--border); border-radius:20px 20px 0 0; max-height:84vh;
    display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.18);
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(26px); opacity:.6} to{transform:none; opacity:1}}
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 20px 12px; border-bottom:1px solid var(--border);
  }
  .sheet-title{font-weight:600; font-size:16px}
  .sheet-sub{font-size:12px; color:var(--muted); margin-top:2px}
  .sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 20px 26px}
  .pick-group{padding:12px 0 2px}
  .pick-group h3{font-size:12px; font-weight:600; color:var(--muted); margin:0 0 8px; letter-spacing:.06em}
  .pick-items{display:flex; flex-wrap:wrap; gap:8px}
  .pick-items .chip{padding:9px 14px; font-size:14px}
  @media (min-width:720px){
    .sheet{align-items:center}
    .sheet-panel{border-radius:20px}
  }
  @media (max-width:420px){
    .card{padding:20px 16px; border-radius:16px}
    .box{height:44px; font-size:16px}
    .actions button{padding:11px 14px}
  }
  @media (min-width:760px){
    body{align-items:center; padding:24px 24px 48px}
    .wrap{max-width:min(1100px,94vw); min-height:calc(100vh - 72px); gap:18px}
    .app{flex:1}
    .card{flex:1; min-height:440px; padding:34px 34px; border-radius:22px}
    .cn{font-size:38px}
    .box{height:58px; font-size:21px; border-radius:12px}
    .zh-prompt{font-size:28px}
    .zh-input{font-size:19px; min-height:120px}
    .actions button{padding:14px 22px; font-size:16px}
    .brand{font-size:17px}
    .counter{font-size:15px}
    .toolbar{font-size:15px; padding:12px 18px}
    .chip{font-size:14px; padding:8px 14px}
    .feedback{font-size:16px}
    .answer{font-size:21px}
    .catname{font-size:15px}
    .cathint{font-size:14px}
  }
  @media (min-width:1200px){
    .wrap{max-width:1200px}
    .cn{font-size:42px}
    .card{padding:40px 40px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="home" id="home">
    <div class="home-title">选择练习</div>
    <div class="home-sub">英语句子、语文句子，每天练一组</div>
    <div class="home-cards">
      <button class="home-card" id="homeEn" type="button">
        <span class="home-emoji">🔤</span>
        <span class="home-name">英语</span>
        <span class="home-desc" id="homeEnDesc">句子练习</span>
      </button>
      <button class="home-card" id="homeZh" type="button">
        <span class="home-emoji">📖</span>
        <span class="home-name">语文</span>
        <span class="home-desc" id="homeZhDesc">句子练习</span>
      </button>
    </div>
  </div>

  <div class="subjectbar" id="subjectbar" hidden>
    <button class="subject" id="homeBtn" type="button">← 首页</button>
  </div>

  <div class="app" id="appEn">
  <header>
    <div class="topline">
      <div class="brand">英语句子练习</div>
      <div class="counter" id="counter">1 / 10</div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="topbar">
      <button class="ghost toolbar grow" id="pickerBtn">专项训练<span class="chev">▾</span></button>
      <button class="ghost toolbar" id="redoBtn">重做</button>
      <button class="ghost toolbar" id="swapBtn">换题</button>
    </div>
  </header>

  <main class="card">
    <div id="quiz">
      <div class="catline">
        <span class="catname" id="catname"></span>
        <span class="cathint" id="cathint"></span>
      </div>
      <p class="cn" id="cn"></p>
      <div class="boxes" id="boxes"></div>
      <div class="actions">
        <button class="primary" id="submit">检查</button>
        <button class="ghost" id="hintBtn">提示</button>
        <button class="ghost" id="skipBtn">看答案</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div id="done" class="done" hidden>
      <div class="emoji" id="doneEmoji">🎉</div>
      <h2 id="doneTitle"></h2>
      <p id="doneText"></p>
      <div class="actions">
        <button class="primary" id="againBtn">再练一遍</button>
        <button class="ghost" id="nextCatBtn">下一类</button>
      </div>
    </div>
  </main>

  <footer>
    <span class="stats" id="stats"></span>
    <div class="tools">
      <button class="ghost small" id="reviewBtn">重练错题</button>
    </div>
  </footer>
  </div>

  <div class="app" id="appZh" hidden>
    <header>
      <div class="topline">
        <div class="brand">语文句子练习</div>
        <div class="counter" id="zhCounter"></div>
      </div>
      <div class="progress"><i id="zhBar"></i></div>
      <div class="topbar">
        <button class="ghost toolbar grow" id="zhPickerBtn">专项训练<span class="chev">▾</span></button>
        <button class="ghost toolbar" id="zhRedoBtn">重做</button>
        <button class="ghost toolbar" id="zhSwapBtn">换题</button>
      </div>
    </header>

    <main class="card">
      <div id="zhQuiz">
        <div class="catline">
          <span class="catname" id="zhCatname"></span>
          <span class="cathint" id="zhCathint"></span>
        </div>
        <p class="zh-prompt" id="zhPrompt"></p>
        <textarea id="zhInput" class="zh-input" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <div id="zhOrder" hidden>
          <div class="build-answer" id="zhOrderAnswer"></div>
          <div class="build-bank" id="zhOrderBank"></div>
        </div>
        <div class="actions">
          <button class="primary" id="zhSubmit">检查</button>
          <button class="ghost" id="zhSkip">看答案</button>
        </div>
        <div class="feedback" id="zhFeedback"></div>
      </div>

      <div id="zhDone" class="done" hidden>
        <div class="emoji" id="zhDoneEmoji">🎉</div>
        <h2 id="zhDoneTitle"></h2>
        <p id="zhDoneText"></p>
        <div class="actions">
          <button class="primary" id="zhAgainBtn">重做这一组</button>
          <button class="ghost" id="zhNextBtn">下一组</button>
        </div>
      </div>
    </main>

    <footer>
      <span class="stats" id="zhStats"></span>
      <div class="tools"></div>
    </footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="选择专项训练">
    <div class="sheet-head">
      <div>
        <div class="sheet-title">选择专项训练</div>
        <div class="sheet-sub">先选句式，再开始练</div>
      </div>
      <button class="ghost small" id="sheetClose">关闭</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ==================== 题库 ====================
     结构：组 → 时态 → 句子
     加句子就往 items 里加 { cn: "中文", en: "English." }
     同一个意思有另一种标准写法、且词数一样时，写 alts: ["..."]。
  */
  const GROUPS = [
    {
      name: "基础",
      subs: [
        {
          id: "basic",
          name: "基础",
          title: "基础句子",
          hint: "常用词组 + 小学到高中句子",
          items: [
            { cn: "起床", en: "get up" },
            { cn: "穿上", en: "put on" },
            { cn: "脱下", en: "take off" },

            { cn: "寻找", en: "look for" },

            { cn: "放弃", en: "give up" },
            { cn: "回来", en: "come back" },
            { cn: "进来", en: "come in" },
            { cn: "出去", en: "go out" },
            { cn: "捡起", en: "pick up" },
            { cn: "放下", en: "put down" },
            { cn: "交上", en: "hand in" },
            { cn: "推迟", en: "put off" },
            { cn: "继续", en: "go on" },
            { cn: "发生", en: "take place" },
            { cn: "用完", en: "run out of" },
            { cn: "处理", en: "deal with" },
            { cn: "依靠", en: "depend on" },
            { cn: "属于", en: "belong to" },
            { cn: "听说", en: "hear about" },
            { cn: "想到", en: "think of" },
            { cn: "担心", en: "worry about" },
            { cn: "等待", en: "wait for" },
            { cn: "听", en: "listen to" },
            { cn: "看", en: "look at" },
            { cn: "到达", en: "arrive at" },
            { cn: "同意", en: "agree with" },
            { cn: "嘲笑", en: "laugh at" },
            { cn: "指向", en: "point at" },
            { cn: "填写", en: "fill in" },
            { cn: "参加", en: "take part in" },
            { cn: "帮忙", en: "help out" },
            { cn: "打扫", en: "clean up" },
            { cn: "做作业", en: "do homework" },
            { cn: "与……相处", en: "get along with" },
            { cn: "与……交朋友", en: "make friends with" },
            { cn: "擅长", en: "be good at" },

            { cn: "忙于", en: "be busy with" },
            { cn: "习惯于", en: "be used to" },
            { cn: "盼望", en: "look forward to" },

            { cn: "在……前面", en: "in front of" },

            { cn: "同时", en: "at the same time" },

            { cn: "例如", en: "for example" },

  const NUM_WORDS = {
    0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',
    9:'nine',10:'ten',11:'eleven',12:'twelve',13:'thirteen',14:'fourteen',15:'fifteen',

  const CONTRACTIONS = [
    ["i'm","i am"],["you're","you are"],["he's","he is"],["she's","she is"],
    ["it's","it is"],["that's","that is"],["there's","there is"],["here's","here is"],
    ["we're","we are"],["they're","they are"],["let's","let us"],["what's","what is"],
    ["don't","do not"],["doesn't","does not"],["didn't","did not"],
    ["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],
    ["can't","can not"],["cannot","can not"],["couldn't","could not"],
    ["won't","will not"],["wouldn't","would not"],["shouldn't","should not"],
    ["haven't","have not"],["hasn't","has not"],["hadn't","had not"],
    ["i've","i have"],["you've","you have"],["we've","we have"],["they've","they have"],
    ["i'll","i will"],["you'll","you will"],["we'll","we will"],["they'll","they will"],
    ["i'd","i would"],["you'd","you would"],["he'd","he would"],["she'd","she would"]
  ];

  function normalize(s){
    var t = String(s == null ? '' : s);
    t = t.replace(/[’‘`´]/g, "'");
    t = t.replace(/[A-Za-z]+(?:'[A-Za-z]+)?/g, function(word){
      var lower = word.toLowerCase();
      for (var i = 0; i < CONTRACTIONS.length; i++){
        if (lower === CONTRACTIONS[i][0]){
          var rep = CONTRACTIONS[i][1];
          if (/^[A-Z]/.test(word)) rep = rep.charAt(0).toUpperCase() + rep.slice(1);
          return rep;
        }
      }
      return word;
    });
    t = t.replace(/[^A-Za-z0-9\s']/g, ' ');
    t = t.replace(/'/g, '');
    t = t.replace(/\s+/g, ' ').trim();
    t = t.split(' ').map(function(w){ return NUM_WORDS[w] || w; }).join(' ');
    return t;
  }

  function isCorrect(input, item){
    var u = normalize(input);
    if (!u) return false;
    var cands = [item.en].concat(item.alts || []);
    for (var i = 0; i < cands.length; i++){
      if (normalize(cands[i]) === u) return true;
    }
    return false;
  }

      if (ALL_CATS[i].id === catId){
        return ALL_CATS[i].items[idx] || null;

    }
    return null;
  }

        Object.keys(base).forEach(function(k){

        });
        saved.pos = base;

      saved.correct = Number.isInteger(raw.correct) ? raw.correct : 0;
      saved.total = Number.isInteger(raw.total) ? raw.total : 0;

      return { start: rs, size: rsize, within: rwithin };

      if (state.doneKind === 'review-group'){
        var rsize = Math.min(GROUP_SIZE, state.reviewQueue.length - state.groupStart);
        doneEmoji.textContent = '✅';
        doneTitle.textContent = '这一组错题练完了';
        doneText.textContent = '这一组 ' + rsize + ' 道题做完了。可以重做这一组，或者继续下一组。';
        againBtn.textContent = '重做这一组';
        nextCatBtn.textContent = '下一组';
        nextCatBtn.hidden = false;
        return;
      }
      var left = state.reviewQueue.filter(function(id){ return state.wrong.indexOf(id) !== -1; }).length;
      doneEmoji.textContent = left === 0 ? '🎉' : '💪';
      doneTitle.textContent = left === 0 ? '错题全部答对了' : '错题重练结束';
      doneText.textContent = left === 0 ? '这一轮的错题你都拿下了。' : '还有 ' + left + ' 句没答对，再练一轮吧。';
      againBtn.textContent = left === 0 ? '返回练习' : '再来一轮';
      nextCatBtn.hidden = true;
      return;
    }

    if (state.doneKind === 'group'){
      var size = Math.min(GROUP_SIZE, currentCat().items.length - state.groupStart);
      doneEmoji.textContent = '✅';
      doneTitle.textContent = '这一组练完了';
      doneText.textContent = '这一组 ' + size + ' 句做完了。可以重做这一组，或者继续下一组。';
      againBtn.textContent = '重做这一组';
      nextCatBtn.textContent = '下一组';
      nextCatBtn.hidden = false;
      return;
    }

    var cat = currentCat();
    doneEmoji.textContent = '🎉';
    doneTitle.textContent = cat.title + ' 练完了';
    doneText.textContent = '这一类一共 ' + cat.items.length + ' 条。可以再练一遍，或者去下一类。';
    againBtn.textContent = '再练一遍';
    nextCatBtn.textContent = '下一类';
    nextCatBtn.hidden = false;
  }

  function moveTo(idx, where){
    var t = boxEls[idx];
    if (!t) return;
    t.focus();
    if (typeof t.setSelectionRange === 'function'){
      var pos = where === 'start' ? 0 : t.value.length;
      try { t.setSelectionRange(pos, pos); } catch (e) {}
    }
  }

  function atEnd(el){
    return typeof el.selectionStart === 'number' &&
      el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
  }
  function atStart(el){
    return typeof el.selectionStart === 'number' &&
      el.selectionStart === 0 && el.selectionEnd === 0;
  }

  function onBoxKey(e){
    var el = e.target;
    var i = parseInt(el.dataset.index, 10);
    if (e.key === 'Enter' && !composing && !e.isComposing){
      e.preventDefault();
      submit();
      return;
    }
    if (e.key === ' '){
      e.preventDefault();
      moveTo(i + 1, 'start');
      return;
    }
    if (e.key === 'ArrowRight' && atEnd(el)){
      e.preventDefault();
      moveTo(i + 1, 'start');
      return;
    }
    if (e.key === 'ArrowLeft' && atStart(el)){
      e.preventDefault();
      moveTo(i - 1, 'end');
      return;
    }
    if (e.key === 'Backspace' && el.value === '' && i > 0){
      e.preventDefault();
      moveTo(i - 1, 'end');
    }
  }

  function buildBoxes(item){
    boxesEl.innerHTML = '';
    boxEls = [];
    var words = wordsOf(item.en);
    words.forEach(function(w, i){
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'box';
      input.value = '';
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      if (input.setAttribute) input.setAttribute('autocorrect', 'off');
      input.dataset.index = String(i);
      input.style.width = wordWidth(w);
      input.addEventListener('keydown', onBoxKey);
      input.addEventListener('input', function(){
        if (/\s/.test(input.value)) input.value = input.value.replace(/\s+/g, '');
      });
      input.addEventListener('paste', function(e){
        var text = '';
        if (e.clipboardData && e.clipboardData.getData) text = e.clipboardData.getData('text');
        if (!text || !/\s/.test(text)) return;
        e.preventDefault();
        var parts = text.trim().split(/\s+/);
        parts.forEach(function(p, k){
          if (boxEls[i + k]) boxEls[i + k].value = p;
        });
        moveTo(Math.min(i + parts.length, boxEls.length - 1), 'end');
      });
      boxesEl.appendChild(input);
      boxEls.push(input);
    });
  }

  function markBoxes(ok, item){
    var answerWords = wordsOf(item.en);
    boxEls.forEach(function(b, i){
      b.classList.remove('ok', 'bad');
      if (ok){
        b.classList.add('ok');
      } else if (normalize(b.value) && normalize(b.value) === normalize(answerWords[i] || '')){
        b.classList.add('ok');
      } else {
        b.classList.add('bad');
      }
      b.readOnly = true;
    });
  }

  function clearBoxState(){
    boxEls.forEach(function(b){
      b.classList.remove('ok', 'bad');
      b.readOnly = false;
      b.value = '';
      b.placeholder = '';
    });
  }

  function prepare(){
    clearTimeout(autoTimer);
    state.answered = false;
    state.finished = false;
    fbEl.innerHTML = '';
    submitBtn.textContent = '检查';
    submitBtn.disabled = false;
    hintBtn.disabled = false;
    hintBtn.style.display = '';
    skipBtn.disabled = false;
    skipBtn.style.display = '';

    var item = null;

    if (state.mode === 'review'){
      while (state.reviewIndex < state.reviewQueue.length){
        var found = findItem(state.reviewQueue[state.reviewIndex]);
        if (found){ item = found; break; }
        state.reviewIndex++;
      }
      if (!item){
        state.current = null;
        state.finished = true;
        state.doneKind = 'review-end';
        save();
        renderDone();
        renderChrome();
        return;
      }
      state.groupStart = Math.floor(state.reviewIndex / GROUP_SIZE) * GROUP_SIZE;
    } else {
      var cat = currentCat();
      var p = state.pos[cat.id] || 0;
      if (p >= cat.items.length){
        state.current = null;
        state.finished = true;
        state.doneKind = 'category';
        save();
        renderDone();
        renderChrome();
        return;
      }
      item = cat.items[p];
      state.groupStart = Math.floor(p / GROUP_SIZE) * GROUP_SIZE;
    }

    state.current = item;
    state.recent.push(item.id);
    if (state.recent.length > 8) state.recent.shift();

    boxesEl.innerHTML = '';
    buildBoxes(item);
    renderChrome();

    if (boxEls[0] && typeof boxEls[0].focus === 'function') boxEls[0].focus();
  }

  function readSentence(){
    return boxEls.map(function(b){ return b.value.trim(); }).join(' ').trim();
  }

  function showFeedback(ok, raw, item){
    fbEl.innerHTML = '';
    var head = document.createElement('div');
    head.className = ok ? 'fb-ok' : 'fb-bad';
    head.textContent = ok ? '✓ 正确' : '✗ 不太对，正确答案是：';
    fbEl.appendChild(head);

    if (ok){
      submitBtn.textContent = '下一题';
      hintBtn.disabled = true;
      skipBtn.disabled = true;
      clearTimeout(autoTimer);
      autoTimer = setTimeout(function(){ if (state.answered) next(); }, 1000);
      return;
    }

    var ans = document.createElement('div');
    ans.className = 'answer';
    ans.textContent = item.en;
    fbEl.appendChild(ans);

    submitBtn.textContent = '下一题';
    hintBtn.style.display = 'none';
    skipBtn.style.display = 'none';
  }

  function submit(){
    if (state.finished) return;
    if (state.answered){ next(); return; }

    var item = state.current;
    if (!item) return;

    for (var k = 0; k < boxEls.length; k++){
      if (!boxEls[k].value.trim()){
        toast('还有格子没填');
        moveTo(k, 'start');
        return;
      }
    }

    var raw = readSentence();
    if (!raw){
      toast('先写一句再检查');
      if (boxEls[0]) boxEls[0].focus();
      return;
    }

    var ok = isCorrect(raw, item);
    state.answered = true;
    state.total++;
    if (ok) state.correct++;

    if (ok){
      if (state.mode === 'review'){
        state.wrong = state.wrong.filter(function(x){ return x !== item.id; });
      }
    } else if (state.wrong.indexOf(item.id) === -1){
      state.wrong.push(item.id);
    }

    save();
    markBoxes(ok, item);
    renderChrome();
    showFeedback(ok, raw, item);
  }

  function skip(){
    if (state.answered || state.finished || !state.current) return;
    var item = state.current;
    state.answered = true;
    state.total++;
    if (state.wrong.indexOf(item.id) === -1) state.wrong.push(item.id);
    save();
    markBoxes(false, item);
    renderChrome();
    showFeedback(false, readSentence(), item);
  }

  function next(){
    clearTimeout(autoTimer);
    state.answered = false;

    if (state.mode === 'review'){
      state.reviewIndex++;
      if (state.reviewIndex >= state.reviewQueue.length){
        state.current = null;
        state.finished = true;
        state.doneKind = 'review-end';
        save();
        renderDone();
        renderChrome();
        return;
      }
      if (state.reviewIndex % GROUP_SIZE === 0){
        state.finished = true;
        state.doneKind = 'review-group';
        save();
        renderDone();
        renderChrome();
        return;
      }
      save();
      prepare();
      return;
    }

    var cat = currentCat();
    var p = (state.pos[cat.id] || 0) + 1;
    state.pos[cat.id] = p;
    save();
    if (p >= cat.items.length){
      state.current = null;
      state.finished = true;
      state.doneKind = 'category';
      renderDone();
      renderChrome();
      return;
    }
    if (p % GROUP_SIZE === 0){
      state.finished = true;
      state.doneKind = 'group';
      renderDone();
      renderChrome();
      return;
    }
    prepare();
  }

  function doHint(){
    if (state.answered || state.finished || !state.current) return;
    hintBtn.disabled = true;
    var words = wordsOf(state.current.en);
    boxEls.forEach(function(b, i){
      if (!b.value) b.placeholder = firstLetter(words[i] || '');
    });
    toast('每个格子的首字母');
  }

  function doRedo(){
    if (state.finished && state.doneKind === 'review-end') { toast('这一轮已经结束了'); return; }
    if (state.mode === 'review'){
      state.reviewIndex = state.groupStart;
    } else {
      var cat = currentCat();
      state.pos[cat.id] = state.groupStart;
    }
    state.finished = false;
    state.doneKind = '';
    prepare();
    toast('重做这一组');
  }

  function doSwap(){
    if (state.mode === 'review') { toast('错题模式不能换题'); return; }
    var cat = currentCat();
    var groups = Math.ceil(cat.items.length / GROUP_SIZE);
    if (groups < 2) { toast('这一类只有一组'); return; }

    var cur = Math.floor((state.pos[cat.id] || 0) / GROUP_SIZE);
    var g = Math.floor(Math.random() * groups);
    var guard = 0;
    while (g === cur && guard < 30){
      g = Math.floor(Math.random() * groups);
      guard++;
    }
    state.pos[cat.id] = g * GROUP_SIZE;
    state.groupStart = g * GROUP_SIZE;
    state.finished = false;
    state.doneKind = '';
    prepare();
    toast('换了一组');
  }

  function exitReview(reload){
    state.mode = 'normal';
    state.reviewQueue = [];
    state.reviewIndex = 0;
    state.groupStart = 0;
    state.finished = false;
    state.doneKind = '';
    if (reload !== false) prepare();
  }

  function startReview(){
    if (state.mode === 'review'){ exitReview(); return; }
    if (!state.wrong.length){ toast('错题本是空的，先正常练几题'); return; }
    state.mode = 'review';
    state.reviewQueue = state.wrong.slice();
    state.reviewIndex = 0;
    state.groupStart = 0;
    state.finished = false;
    state.doneKind = '';
    save();
    prepare();
  }

  function handleAgain(){
    if (state.mode === 'review'){
      if (state.doneKind === 'review-group'){
        state.reviewIndex = state.groupStart;
        state.finished = false;
        state.doneKind = '';
        prepare();
        return;
      }
      state.reviewQueue = state.wrong.slice();
      state.reviewIndex = 0;
      state.groupStart = 0;
      if (!state.reviewQueue.length){ exitReview(); return; }
      state.finished = false;
      state.doneKind = '';
      prepare();
      return;
    }

    if (state.doneKind === 'group'){
      var cat = currentCat();
      state.pos[cat.id] = state.groupStart;
      state.finished = false;
      state.doneKind = '';
      save();
      prepare();
      return;
    }

    var c2 = currentCat();
    state.pos[c2.id] = 0;
    state.groupStart = 0;
    state.finished = false;
    state.doneKind = '';
    save();
    prepare();
  }

  function goNextCategory(){
    if (state.mode === 'review'){
      if (state.doneKind === 'review-group'){
        state.finished = false;
        state.doneKind = '';
        prepare();
      }
      return;
    }
    if (state.doneKind === 'group'){
      state.finished = false;
      state.doneKind = '';
      prepare();
      return;
    }
    var idx = ALL_CATS.indexOf(currentCat());
    if (idx < 0 || idx >= ALL_CATS.length - 1){ toast('已经是最后一类了'); return; }
    state.catId = ALL_CATS[idx + 1].id;
    state.groupStart = 0;
    state.finished = false;
    state.doneKind = '';
    save();
    prepare();
  }

            { prompt: "改写成比喻句：\n那位老爷爷很凶。", answer: "那位老爷爷凶得像一只发怒的老虎。" },
            { prompt: "改写成比喻句：\n她的头发十分蓬乱。", answer: "她的头发十分蓬乱，像一团乱糟糟的鸟窝。" },
            { prompt: "改写成比喻句：\n老师亲切的教导滋润了同学们的心田。", answer: "老师亲切的教导像春雨一样，滋润了同学们的心田。" },
            { prompt: "改写成拟人句：\n溪水在田间哗哗地流淌。", answer: "溪水唱着歌，在田间哗哗地流淌。" },
            { prompt: "改写成比喻句：\n这里的景色非常美丽。", answer: "这里的景色非常美丽，像一幅画。" },
            { prompt: "改写成比喻句：\n大雪过后，地上全白了。", answer: "大雪过后，地上全白了，像铺上了一层厚厚的白地毯。" },
            { prompt: "改写成拟人句：\n蝴蝶和蜜蜂在青草野花间飞来飞去。", answer: "蝴蝶和蜜蜂在青草野花间翩翩起舞。" },
            { prompt: "改写成拟人句：\n风儿吹拂着大地。", answer: "风儿轻轻地抚摸着大地。" },
            { prompt: "改写成拟人句：\n雨滴落在雨伞上。", answer: "雨滴在雨伞上欢快地跳着舞。" },
            { prompt: "改写成比喻句：\n圆圆的荷叶挨挨挤挤的。", answer: "圆圆的荷叶像一把把绿色的小伞，挨挨挤挤地站在一起。" },
            { prompt: "改写成比喻句：\n小海豚在微微起浪的海面上跳来跳去，可快活了。", answer: "小海豚像一个个淘气的孩子，在微微起浪的海面上跳来跳去。" },
            { prompt: "改写成拟人句：\n小海豚在微微起浪的海面上跳来跳去，可快活了。", answer: "小海豚在微微起浪的海面上快活地撒着欢儿。" },
            { prompt: "改写成拟人句：\n风停了，雨住了，太阳出来了。", answer: "风停了，雨住了，太阳露出了笑脸。" },
            { prompt: "改写成拟人句：\n海底的动物常常发出声音。", answer: "海底的动物常常聚在一起，小声地聊着天。" },
            { prompt: "反问句改陈述句：\n难道我们不应该爱护花草吗？", answer: "我们应该爱护花草。", mode: "strict" },
            { prompt: "反问句改陈述句：\n这难道不是一所特别的小学吗？", answer: "这是一所特别的小学。", mode: "strict" },
            { prompt: "反问句改陈述句：\n难道这不是你的错吗？", answer: "这是你的错。", mode: "strict" },
            { prompt: "反问句改陈述句：\n你难道不应该早点休息吗？", answer: "你应该早点休息。", mode: "strict" },
            { prompt: "把字句改被字句：\n同学们把校园打扮得漂漂亮亮。", answer: "校园被同学们打扮得漂漂亮亮。", mode: "strict" },
            { prompt: "把字句改被字句：\n风把蒲公英的种子吹向远方。", answer: "蒲公英的种子被风吹向远方。", mode: "strict" },
            { prompt: "把字句改被字句：\n妈妈把房间打扫干净了。", answer: "房间被妈妈打扫干净了。", mode: "strict" },
            { prompt: "把字句改被字句：\n雨水把路面淋湿了。", answer: "路面被雨水淋湿了。", mode: "strict" }

    {
      name: "句子仿写",
      subs: [
        {
          id: "zh-imitate",
          name: "句子仿写",
          title: "句子仿写",
          hint: "比喻、拟人、排比、夸张、条件句、固定句式、排比段",
          mode: "open",
          items: [
            { prompt: "仿写比喻句：\n爱心是冬日里的一片阳光，使饥寒交迫的人感到人间的温暖。", answer: "爱心是沙漠里的一泓清泉，使濒临绝境的人看到希望。" },
            { prompt: "仿写比喻句：\n母爱是一缕阳光，让你的心灵即使在寒冷的冬天也能感到温暖如春。", answer: "母爱是一阵春风，让你的心灵即使在炎热的夏天也能感到清凉舒适。" },
            { prompt: "仿写句子：\n时间好比春风，它能帮助我们驱散心头的愁云；时间如同细雨，它能帮助我们洗去心灵的杂质。", answer: "时间好比阳光，它能帮助我们照亮前行的道路；时间如同良药，它能帮助我们抚平心灵的创伤。" },
            { prompt: "仿写排比句：\n适应是什么？适应是悬崖峭壁上顽强生长的青松，是寒冬腊月里傲雪盛开的腊梅，是电闪雷鸣中高傲飞翔的海燕。", answer: "坚强是什么？坚强是石缝中顽强生长的小草，是狂风中挺立的大树，是暴雨中勇敢飞翔的雄鹰。" },
            { prompt: "仿写比喻句：\n人生就像一首诗，应该多一些热烈的抒情，少一些愁苦的叹息。", answer: "人生就像一幅画，应该多一些明丽的色彩，少一些灰暗的阴影。" },
            { prompt: "仿写句子：\n人生是一首歌，以悠扬的旋律唱出你春天的耕耘和秋天的收获。", answer: "人生是一幅画，以绚丽的色彩描绘你昨日的汗水和明日的希望。" },
            { prompt: "仿写句子：\n选择了高山，你也就选择了坎坷；选择了长河，你也就选择了跋涉。", answer: "选择了远方，你也就选择了风雨；选择了大海，你也就选择了远航。" },
            { prompt: "仿写比喻句：\n历史是一本书，时间是一支笔。", answer: "生活是一幅画，岁月是一支笔。" },
            { prompt: "仿写比喻句：\n人生的岁月是一串珍珠，漫长的生活是一组乐曲。", answer: "青春的岁月是一首歌，奋斗的历程是一幅画。" },
            { prompt: "仿写排比句：\n如果你是一座森林，就留下一片绿色；如果你是一汪清泉，就灌溉一片田野；____，____。", answer: "如果你是一轮太阳，就照亮一片天空；如果你是一缕春风，就吹绿一片大地。" },
            { prompt: "仿写排比句：\n朋友是成功道路上的一位良师，热情地将你引向阳光的地带；朋友是失败苦闷中的一盏明灯，默默地为你照亮前行的路途；朋友是____，____。", answer: "朋友是迷茫时的一盏灯塔，静静地为你指明前进的方向。" },
            { prompt: "仿写句子：\n见过大海的广阔，才会了解江湖的窄小；见过高山的巍峨，才会了解____；见过____，才会了解____。", answer: "见过高山的巍峨，才会了解丘陵的低矮；见过天空的辽阔，才会了解大地的渺小。" },
            { prompt: "仿写句子：\n如果你是鱼儿，那快乐就是一汪清凉的水；如果你是小草，那快乐就是一束温暖的阳光；如果你是____，那快乐就是____；如果你是____，那快乐就是____。", answer: "如果你是小鸟，那快乐就是一片蔚蓝的天空；如果你是花朵，那快乐就是一场滋润的春雨。" },
            { prompt: "仿写排比句：\n老师的教导是一个路标，在你迷失方向之时，给你指明前进的方向；老师的教导是一口清泉，在你干渴之时，给你生命的滋润；老师的教导是____，在你____，给你____。", answer: "老师的教导是一盏明灯，在你迷茫无助之时，给你前行的勇气。" },
            { prompt: "仿写句子：\n热爱是什么？热爱是风，热爱是雨。因为热爱，我们甘于淡泊宁静的日子；也因为热爱，我们敢于金戈铁马去，马革裹尸还。兴趣是什么？兴趣是____，兴趣是____。因为兴趣，我们____。", answer: "兴趣是火，兴趣是光。因为兴趣，我们甘于寂寞枯燥的钻研。" },
            { prompt: "仿写句子：\n如果我是大河，何必在乎别人把你说成小溪？如果你是峰峦，何必在乎____？如果你是太阳，何必在乎____？", answer: "如果你是峰峦，何必在乎别人把你说成土丘？如果你是太阳，何必在乎别人把你说成星星？" },
            { prompt: "仿写排比句：\n绿色是生命，生机盎然；红色是____，____；金色是____，____。", answer: "红色是热情，燃烧如火；金色是收获，灿烂如阳。" },
            { prompt: "仿写句子：\n仿照“他是一张白纸，毫无成见地去接受客观事实”，再写两个句子。\n他是____，永不停息地奔向前方。\n他是一只雄鹰，____。", answer: "他是一匹骏马，永不停息地奔向前方。他是一只雄鹰，勇敢地翱翔在蓝天。" },
            { prompt: "仿写句子：\n如果光明照不亮黑暗，那么阳光也无法驱走寒冷；如果____，那么____。", answer: "如果春雨滋润不了干涸，那么甘霖也无法唤醒大地。" },
            { prompt: "仿写句子：\n如果我是阳光，我将照亮所有黑暗。\n如果我是清风，我将____。\n如果我是春雨，我将____。", answer: "如果我是清风，我将吹散所有炎热。如果我是春雨，我将滋润所有干涸的土地。" },
            { prompt: "仿写句子：\n没有石块的聚积，就没有高山的巍峨；没有____的聚积，就没有____。", answer: "没有水滴的聚积，就没有大海的辽阔。" },
            { prompt: "仿写句子：\n竹：每攀登一步，都作一次小结。\n月亮：____。\n花朵：____。", answer: "月亮：每圆满一次，都照亮一片夜空。花朵：每绽放一次，都装扮一片春天。" },
            { prompt: "仿写拟人句：\n春天像花枝招展的小姑娘，笑着，走着。", answer: "夏天像热情奔放的少年，跑着，喊着。" },
            { prompt: "仿写比喻句：\n生活就像一块五彩斑斓的调色板。", answer: "生活就像一首跌宕起伏的乐曲。" },
            { prompt: "仿写句子：\n人的一生像树，要刚正，人格须挺立。", answer: "人的一生像河，要向前，脚步须坚定。" },
            { prompt: "仿写排比句：\n老师的话像和煦的春风，吹散我们心头的乌云；老师的话像____，滋润着我们的心田；老师的话像____，____。", answer: "老师的话像绵绵的春雨，滋润着我们的心田；老师的话像温暖的阳光，照亮我们前行的道路。" },
            { prompt: "仿写排比句：\n人生如一首歌，应该多一些昂扬，少一些萎靡；人生如一首诗，应该多一些热烈，少一些愁苦；人生如____，应该多一些____，少一些____。", answer: "人生如一幅画，应该多一些明丽，少一些灰暗。" },
            { prompt: "仿写比喻句：\n游子离开了祖国，就像巨轮离开了海洋，就像鸟儿____，就像____。", answer: "就像鸟儿离开了天空，就像鱼儿离开了水。" },
            { prompt: "仿写句子：\n秋姑娘一吹，山林就变得五彩缤纷，田野就变得____。", answer: "田野就变得金黄一片。" },
            { prompt: "仿写排比句：\n生命如大海，奔腾向前；生命如小草，____；____，____。", answer: "生命如小草，顽强生长；生命如火焰，热烈燃烧。" },
            { prompt: "仿写排比句：\n书籍好比一座阶梯，它能引导我们登上知识的殿堂；书籍如同一把钥匙，它能帮助我们开启心灵的智慧之窗；书籍就像____，它能____。", answer: "书籍就像一艘航船，它能载着我们驶向理想的彼岸。" },
            { prompt: "仿写比喻句：\n人生是一本书，童年是序章；人生是____，童年是____。", answer: "人生是一幅画，童年是最亮的一抹色彩。" },
            { prompt: "仿写排比句：\n信誉是你结交朋友的桥梁，信誉是你____，信誉是你____。", answer: "信誉是你立足社会的基石，信誉是你赢得尊重的名片。" },
            { prompt: "仿写排比句：\n成功要用理想去引路，要用创造去开拓，要用汗水去浇灌。友谊____，____，____。", answer: "友谊要用真诚去播种，要用理解去呵护，要用宽容去滋养。" },
            { prompt: "仿写排比句：\n我梦想，驰骋于塞外辽阔的大漠，在金黄的夕阳中，感受“长河落日圆”的雄浑；我梦想，置身于江南秀丽的小镇，在绵绵的细雨中，体味“水村山郭酒旗风”的情调；我梦想，____，____，____。", answer: "我梦想，漫步于海边柔软的沙滩，在清凉的海风中，聆听“潮平两岸阔”的壮阔。" },
            { prompt: "仿写排比句：\n团结是一种品格，一朵鲜花点缀不出绚丽的春天，一个音符____，一块碎石____，一滴水珠____。", answer: "一个音符谱不出动人的乐章，一块碎石铺不成宽阔的道路，一滴水珠汇不成浩瀚的海洋。" },
            { prompt: "仿写比喻句：\n父爱是一棵白杨，让你的心灵即使在炎热的沙漠，也能感到阵阵清凉；父爱是一个火炉，让你的____，____。", answer: "父爱是一把大伞，让你的心灵即使在倾盆大雨中，也能感到一片晴空。" },
            { prompt: "仿写排比句：\n人们都爱秋天，爱她的天高气爽，爱她的云淡日丽，爱她的香飘四野。人们都爱____，爱她的____，爱她的____，爱她的____。", answer: "人们都爱春天，爱她的风和日丽，爱她的百花齐放，爱她的生机勃勃。" },
            { prompt: "仿写排比句：\n春天的雨，细腻而轻柔，给山野披上美丽的衣裳；夏天的雷，迅疾而猛烈，为生命敲响热烈的战鼓；秋天的风，____；冬天的雪，____。", answer: "秋天的风，凉爽而轻柔，给大地染上金黄的颜色；冬天的雪，洁白而安静，为田野盖上一层厚厚的棉被。" },
            { prompt: "仿写排比句：\n早晨，从山坡上，从坪坝里，从一条条开着绒球花和太阳花的小路上，走来了许多小学生。", answer: "清晨，从田野里，从村口，从一条条铺满露珠的小路上，走来了许多赶集的人。" },
            { prompt: "仿写排比句：\n同学们向校园里欢唱的小鸟打招呼，向敬爱的老师问好，向高高飘扬的国旗敬礼。", answer: "我们向辛勤的老师问好，向亲爱的同学招手，向美丽的校园微笑。" },
            { prompt: "仿写句子（动作描写、拟人）：\n下课了，大家在大青树下跳孔雀舞、摔跤、做游戏，招引来许多小鸟，连松鼠也赶来看热闹。", answer: "放学了，同学们在操场上跳绳、踢球、追逐嬉戏，引来了一群小鸟，连路边的柳树也摇着枝条来看热闹。" },
            { prompt: "仿写拟人句：\n当雷云在天上轰响，六月的阵雨落下的时候，湿润的东风走过荒野，在竹林中吹着口笛。", answer: "当太阳爬上山顶，清晨的薄雾散去的时候，温柔的春风走过田野，在麦田里跳着舞。" },
            { prompt: "仿写拟人句：\n树枝在林中互相碰触着，绿叶在狂风里簌簌地响，雷云拍着大手。", answer: "小草在雨中互相点头，树叶在风里沙沙地唱歌，雷公公敲起了大鼓。" },
            { prompt: "仿写想象句：\n你可知道，妈妈，他们的家是在天上，在星星所住的地方。", answer: "你可知道，妈妈，我的梦是在云朵上，在月亮歇脚的地方。" },
            { prompt: "仿写心理描写：\n孙中山想：这样糊里糊涂地背，有什么用呢？", answer: "我想：这样马马虎虎地写，怎么能写好呢？" },
            { prompt: "仿写比喻句：\n那时候上课，先生念，学生跟着念，咿咿呀呀，像唱歌一样。", answer: "老师读，同学们跟着读，抑扬顿挫，像唱歌一样。" },
            { prompt: "仿写拟人句：\n这时候，窗外十分安静，树枝不摇了，鸟儿不叫了，蝴蝶停在花朵上，好像都在听同学们读课文。", answer: "教室里十分安静，风儿不吹了，树叶不响了，连窗外的云朵也停住了脚步，好像都在听老师讲课。" },
            { prompt: "仿写比喻句：\n每一片法国梧桐树的落叶，都像一个金色的小巴掌，熨帖地、平展地粘在水泥道上。", answer: "每一片银杏树的落叶，都像一把金色的小扇子，轻轻地、整齐地铺在小路上。" },
            { prompt: "仿写比喻句：\n我穿着一双棕红色的小雨靴。你瞧，这多像两只棕红色的小鸟，在秋天金黄的叶丛间，愉快地蹦跳着、歌唱着……", answer: "我戴着一顶红色的小帽子。你瞧，这多像一朵红色的小花，在春天碧绿的草地上，快乐地摇着头、笑着……" },
            { prompt: "仿写比喻句：\n秋天的雨，是一把钥匙。它带着清凉和温柔，轻轻地，轻轻地，趁你没留意，把秋天的大门打开了。", answer: "春天的风，是一把钥匙。它带着温暖和花香，轻轻地，轻轻地，趁你没留意，把春天的大门打开了。" },
            { prompt: "仿写比喻句：\n它把黄色给了银杏树，黄黄的叶子像一把把小扇子，扇哪扇哪，扇走了夏天的炎热。", answer: "它把红色给了枫树，红红的叶子像一枚枚邮票，飘哇飘哇，邮来了秋天的凉爽。" },
            { prompt: "仿写比喻句：\n秋天的雨，有一盒五彩缤纷的颜料。", answer: "春天的风，有一支神奇的画笔。" },
            { prompt: "仿写拟人句：\n美丽的菊花在秋雨里频频点头。", answer: "可爱的桃花在春风里点头微笑。" },
            { prompt: "仿写心理描写：\n“好了，我到了倒下的时候了！”它这样想着，准备往旁边倒去。", answer: "“好了，我该回家吃饭了！”我这样想着，背起书包往校门口走去。" },
            { prompt: "仿写动作描写：\n小蜘蛛飞快地爬进屋子，在屋檐上织了张又大又漂亮的网。偶尔有虫子撞到网上，小蜘蛛马上爬过去把虫子吃掉。", answer: "小燕子轻快地飞进院子，在屋檐下衔泥筑了一个又结实又漂亮的窝。偶尔有飞虫经过，小燕子立刻扑过去把它捉住。" },
            { prompt: "仿写语言描写：\n乌龟说：“我的决定是不可改变的。”", answer: "爸爸说：“我的决定是不会改变的。”" },
            { prompt: "仿写句子（反复）：\n小狗跑啊，跑啊，跑到了一片草地上，一头小奶牛正在那里吃草。", answer: "小溪流啊，流啊，流到了一片田野里，一群小鱼正在那里嬉戏。" },
            { prompt: "仿写心理描写：\n我要是有了一宝葫芦，我该怎么办？我该要些什么？", answer: "我要是有了一双翅膀，我该怎么办？我该飞到哪里去？" },
            { prompt: "仿写拟人句：\n我家里的那几棵又长又瘦，上面顶着一个小脑袋，可怜巴巴的样儿。", answer: "院子里的那几株向日葵又高又瘦，上面顶着一个大脑袋，傻乎乎的样儿。" },
            { prompt: "仿写对话描写：\n“救命啊！救命啊！”红头拼命地叫起来。“你在哪儿？”青头急忙问。", answer: "“快来呀！快来呀！”小明大声喊道。“你在哪儿？”妈妈着急地问。" },
            { prompt: "仿写动作描写：\n青头大吃一惊，它一下子蹦到牛身上，可是那头牛用尾巴轻轻一扫，青头就给摔到地上了。", answer: "小猫大吃一惊，它一下子跳到桌子上，可是妈妈用手轻轻一挥，小猫就给赶到地上了。" },
            { prompt: "仿写语言和动作描写：\n“谢谢你！”红头的声音小得几乎听不见。它咬着牙不让自己失去知觉。", answer: "“谢谢你！”她的声音轻得几乎听不见。她咬着嘴唇不让自己哭出来。" },
            { prompt: "仿写夸张句：\n奶酪多诱人啊！抬着它，不要说吃，单是闻闻，都要淌口水。", answer: "烤鸭多香啊！端上桌，不要说吃，单是闻闻，都要流口水。" },
            { prompt: "仿写环境描写（加拟声词）：\n天下着大雨，雨点打在船篷上，沙啦沙啦地响。", answer: "天上飘着细雨，雨点落在窗户上，滴答滴答地响。" },
            { prompt: "仿写外形细节：\n它的羽毛是翠绿的，翅膀带着一些蓝色，比鹦鹉还漂亮。它还有一张红色的嘴。", answer: "它的毛是雪白的，耳朵带着一点灰色，比兔子还可爱。它还有一双红红的眼睛。" },
            { prompt: "仿写连续动作：\n我正想着，它一下子冲进水里，不见了。可是，没一会儿，它飞起来了，红色的长嘴衔着一条小鱼。它站在船头，一口把小鱼吞了下去。", answer: "我正看着，它一下子钻进草丛里，不见了。可是，没一会儿，它跳出来了，嘴里衔着一根青草。它蹲在石头上，一口一口地吃了起来。" },
            { prompt: "仿写视觉和感叹：\n后来雨停了。我看见一只彩色的小鸟站在船头，多么美丽啊！", answer: "后来天晴了。我看见一道彩虹挂在天边，多么美丽啊！" },
            { prompt: "仿写比喻句：\n原来，蒲公英的花就像我们的手掌，可以张开、合上。", answer: "原来，含羞草的叶子就像我们的手掌，可以张开、合上。" },
            { prompt: "仿写感叹句：\n多么可爱的草地！多么有趣的蒲公英！", answer: "多么清澈的小河！多么美丽的鱼儿！" },
            { prompt: "仿写排比句：\n西沙群岛的海水五光十色，瑰丽无比：有深蓝的，淡青的，浅绿的，杏黄的。", answer: "花园里的花五颜六色，美丽无比：有红的，黄的，紫的，白的。" },
            { prompt: "仿写排比句：\n有的全身布满彩色的条纹；有的头上长着一簇红缨；有的周身像插着好些扇子，游动的时候飘飘摇摇；有的眼睛圆溜溜的，身上长满了刺，鼓起气来像皮球一样圆。", answer: "天上的云变化多端：有的像奔腾的骏马，有的像温顺的绵羊，有的像翻滚的浪花，有的像连绵的山峰。" },
            { prompt: "仿写比喻句：\n海底的岩石上生长着各种各样的珊瑚，有的像绽开的花朵，有的像分枝的鹿角。", answer: "山坡上开满了各种各样的野花，有的像金色的小喇叭，有的像紫色的小铃铛。" },
            { prompt: "仿写比喻句：\n一棵棵榕树就像一顶顶撑开的绿绒大伞，树叶密不透风，可以遮太阳，挡风雨。", answer: "一棵棵白杨就像一个个挺拔的卫士，枝叶密密层层，可以遮太阳，挡风沙。" },
            { prompt: "仿写比喻和拟人：\n风，是大自然的音乐家。他会在森林里演奏他的手风琴。", answer: "雨，是大自然的鼓手。他会在屋顶上敲起他的小鼓。" },
            { prompt: "仿写比喻句：\n当微风拂过，那声音轻轻柔柔的，好像呢喃细语，让人感受到大自然的温柔。", answer: "当细雨落下，那声音淅淅沥沥的，好像低声诉说，让人感受到春天的温柔。" },
            { prompt: "仿写排比句：\n动物是大自然的歌手。走在公园里，听听树上叽叽喳喳的鸟叫；坐在一棵树下，听听唧哩哩唧哩哩的虫鸣；在水塘边散步，听听青蛙的歌唱。", answer: "植物是大自然的画家。走在田野里，看看金黄的稻穗；坐在山坡上，看看火红的枫叶；在小河边散步，看看碧绿的柳条。" },
            { prompt: "仿写神态和动作描写：\n白求恩仍然镇定地站在手术台旁。他接过助手递过来的镊子，敏捷地从伤员的腹腔里取出一块弹片，扔在盘子里。", answer: "医生仍然沉着地站在手术台旁。他接过护士递过来的剪刀，熟练地从伤口里取出一块碎玻璃，放在盘子里。" },
            { prompt: "仿写语言描写：\n白求恩说：“我是一名八路军战士，不是你们的客人。”", answer: "小明说：“我是一名少先队员，不是胆小鬼。”" },
            { prompt: "仿写语言描写：\n赵一曼看着这个碗，对通讯员说：“哪里拿来的，请你还到哪里去！”", answer: "妈妈看着这件玩具，对我说：“哪里拿来的，请你放回哪里去！”" },
            { prompt: "仿写设置悬念：\n这个碗，赵一曼仅仅用过一次，却有一段感人的故事。", answer: "这支笔，爷爷仅仅用过一次，却有一段难忘的往事。" },
            { prompt: "仿写“一……就……”：\n太阳一晒，我就变成汽。", answer: "风一吹，柳枝就轻轻摇摆。" },
            { prompt: "仿写“有时候……有时候……”：\n有时候我很温和，有时候我却很暴躁。", answer: "有时候我很安静，有时候我却很活泼。" },
            { prompt: "仿写排比句：\n平常我在池子里睡觉，在小溪里散步，在江河里奔跑，在海洋里跳舞，唱歌，开大会。", answer: "平常我在教室里读书，在操场上奔跑，在图书馆里看书，在舞台上唱歌、跳舞、表演节目。" },
            { prompt: "仿写“如果……就……”：\n孩子如果已经长大，就得告别妈妈，四海为家。", answer: "小鸟如果已经长大，就得告别巢穴，展翅高飞。" },
            { prompt: "仿写“只要……就……”：\n只要有风轻轻吹过，孩子们就乘着风纷纷出发。", answer: "只要春天悄悄来临，小草就探出头来纷纷张望。" },
            { prompt: "仿写拟人句：\n小水滴聚在一起落下来，人们叫我“雨”。", answer: "小雪花聚在一起飘下来，人们叫我“雪”。" },
            { prompt: "仿写拟人句：\n有时候我变成小硬球打下来，人们就叫我“冰雹”。", answer: "有时候我变成小冰晶落下来，人们就叫我“霜”。" }
          ]
        }
      ]
    },
    {
      name: "句子扩写",
      subs: [
        {
          id: "zh-expand",
          name: "句子扩写",
          title: "句子扩写",
          hint: "加修饰语、扩成比喻句、扩成拟人句",
          mode: "open",
          items: [
            { prompt: "扩写句子（加修饰语）：\n柳枝上长出了叶子。", answer: "柔软的柳枝上长出了嫩绿的叶子。" },
            { prompt: "扩写句子（加修饰语）：\n风筝在空中飞着。", answer: "五颜六色的风筝在蓝蓝的空中自由地飞着。" },
            { prompt: "扩写句子（加修饰语）：\n小红在读书。", answer: "小红在明亮的教室里认真地读书。" },
            { prompt: "扩写句子（加修饰语）：\n鱼儿在游来游去。", answer: "鱼儿在清清的河水里快活地游来游去。" },
            { prompt: "扩写句子（加修饰语）：\n河水绕着村子流。", answer: "清清的河水绕着宁静的村子缓缓地流。" },
            { prompt: "扩写句子（加修饰语）：\n校园里传来读书声。", answer: "安静的校园里传来琅琅的读书声。" },
            { prompt: "扩写句子（加修饰语）：\n街上有一座座楼房。", answer: "热闹的街上有一座座高大的楼房。" },
            { prompt: "扩写句子（加修饰语）：\n树上挂满了柿子。", answer: "高高的树上挂满了红彤彤的柿子。" },
            { prompt: "扩写句子（加修饰语）：\n雪花从空中飘落下来。", answer: "洁白的雪花从灰蒙蒙的空中慢慢地飘落下来。" },
            { prompt: "扩写句子：\n外婆在修鞋子。\n提示：怎样的外婆在修什么样的鞋子。", answer: "满头白发的外婆在修一双破旧的鞋子。" },
            { prompt: "扩写句子：\n柳条拂过水面。\n提示：什么样的柳条拂过什么样的水面。", answer: "柔软的柳条轻轻拂过平静的水面。" },
            { prompt: "扩写句子：\n春风吹遍大地。\n提示：什么样的春风吹遍什么样的大地。", answer: "温暖的春风吹遍辽阔的大地。" },
            { prompt: "扩写句子：\n天空中挂着圆月。\n提示：怎样的天空中挂着什么样的圆月。", answer: "深蓝的天空中挂着一轮圆圆的明月。" },
            { prompt: "扩写句子：\n小草吮吸着露水。\n提示：什么样的小草吮吸着什么样的露水。", answer: "嫩绿的小草贪婪地吮吸着晶莹的露水。" },
            { prompt: "扩写句子：\n蜻蜓落在荷花上。\n提示：怎样的蜻蜓落在什么样的荷花上。", answer: "一只红色的蜻蜓轻轻地落在粉红的荷花上。" },
            { prompt: "扩写句子：\n阳光抚摸着大地。\n提示：什么样的阳光怎样抚摸着大地。", answer: "温暖的阳光温柔地抚摸着辽阔的大地。" },
            { prompt: "扩写句子：\n小蜜蜂飞来飞去。\n提示：什么样的小蜜蜂怎样飞来飞去。", answer: "勤劳的小蜜蜂在花丛中忙碌地飞来飞去。" },
            { prompt: "扩写句子：\n秧苗生长。\n提示：什么样的秧苗怎样生长。", answer: "嫩绿的秧苗在田野里茁壮地生长。" },
            { prompt: "扩写句子：\n列车穿过山谷。\n提示：什么样的列车怎样地穿过什么样的山谷。", answer: "长长的列车快速地穿过幽深的山谷。" },
            { prompt: "扩写句子：\n雨往下落。\n提示：什么样的雨像什么一样往下落。", answer: "细细的雨像断了线的珠子一样往下落。" },
            { prompt: "扩写句子：\n车开得快。\n提示：什么样的车开得像什么一样快。", answer: "黑色的车开得像一阵风一样快。" },
            { prompt: "扩写句子：\n父亲跨过栏杆。\n提示：什么样的父亲怎样地跨过什么样的栏杆。", answer: "高大的父亲麻利地跨过矮矮的栏杆。" },
            { prompt: "扩写句子：\n阳光照耀着水面。\n提示：什么样的阳光怎样地照耀着什么样的水面。", answer: "金色的阳光温柔地照耀着平静的水面。" },
            { prompt: "扩写句子：\n列车在奔驰。\n提示：写出列车的颜色。", answer: "白色的列车在铁轨上飞快地奔驰。" },
            { prompt: "扩写句子：\n小蜜蜂飞来飞去。\n提示：写出小蜜蜂的状态。", answer: "小蜜蜂嗡嗡地飞来飞去，忙着采蜜。" },
            { prompt: "扩写句子：\n寒风吹着我。\n提示：写出寒风的特点。", answer: "刺骨的寒风吹着我，冻得我直发抖。" },
            { prompt: "扩写句子：\n荷花开花了。\n提示：写出荷花的特点。", answer: "粉红的荷花张开了美丽的花瓣。" },
            { prompt: "扩写句子：\n树枝发芽了。\n提示：写出树枝的样子。", answer: "光秃秃的树枝上冒出了嫩绿的新芽。" },
            { prompt: "扩写句子：\n教室里传出读书声。\n提示：用恰当的词语描写教室。", answer: "明亮的教室里传出琅琅的读书声。" },
            { prompt: "扩写句子：\n草地变得金黄。\n提示：用恰当的词语描写草地。", answer: "一大片草地渐渐变得金黄。" },
            { prompt: "扩写句子：\n落叶飞舞着。\n提示：用恰当的词语表现飞舞的状态。", answer: "金黄的落叶在空中轻轻地飞舞着。" },
            { prompt: "扩写句子：\n稻田里传来笑声。\n提示：用恰当的词语形容笑声。", answer: "稻田里传来一阵阵欢快的笑声。" },
            { prompt: "扩写句子：\n爷爷高兴。\n提示：用恰当的词语形容高兴的程度。", answer: "爷爷高兴得合不拢嘴。" },
            { prompt: "扩写句子：\n他走进了教室。\n提示：用恰当的词语形容教室的样子。", answer: "他轻轻推开门，走进了安静的教室。" },
            { prompt: "扩写句子：\n春风吹过。\n提示：用恰当的词语表现春风吹拂的状态。", answer: "温暖的春风轻轻地吹过。" },
            { prompt: "扩写句子：\n雷声响彻天边。\n提示：用恰当的词语表现雷声的状态。", answer: "轰隆隆的雷声响彻天边。" },
            { prompt: "扩写句子：\n山泉水流动。\n提示：写出山泉水的特点和流动的地点。", answer: "清凉的山泉水在山石间缓缓地流动。" },
            { prompt: "扩写句子：\n树叶落下。\n提示：写出树叶的颜色和从哪里落下。", answer: "金黄的树叶从高高的枝头飘落下来。" },
            { prompt: "扩写句子：\n老翁垂钓。\n提示：写出老翁的样子和垂钓的地点。", answer: "白发苍苍的老翁坐在河边静静地垂钓。" },
            { prompt: "扩写句子：\n田野里长满了小草。\n提示：写出田野的样子和小草的颜色。", answer: "辽阔的田野里长满了绿油油的小草。" },
            { prompt: "扩写句子：\n我走过河畔。\n提示：写出“我”的心情。", answer: "我怀着愉快的心情走过河畔。" },
            { prompt: "扩写句子：\n雨点落下来。\n提示：写出雨点的特点和从哪里落下来。", answer: "冰冷的雨点从乌云中落下来。" },

            { prompt: "仿写“那一刻，我懂得了父爱”，写一件小事。", answer: "那天放学突然下起大雨，我没带伞，正发愁时，看见爸爸站在校门口，衣服湿了一大片。他把伞递给我，只说了一句“快走”，自己却走在雨里。那一刻，我懂得了父爱。" },

            { prompt: "写一写你喜欢的季节。", answer: "我最喜欢秋天。秋天的天空又高又蓝，树叶变成了金黄色，风一吹，像一只只蝴蝶落下来。田野里一片金黄，到处是丰收的景象。" },

      if (zraw.pos && typeof zraw.pos === 'object') {
        Object.keys(zhState.pos).forEach(function (k) {
          if (Number.isInteger(zraw.pos[k]) && zraw.pos[k] >= 0) zhState.pos[k] = zraw.pos[k];
        });
      }
      if (Number.isInteger(zraw.correct)) zhState.correct = zraw.correct;
      if (Number.isInteger(zraw.total)) zhState.total = zraw.total;
    }
  } catch (e) {}

  function zhSave() {
    try {
      localStorage.setItem(ZH_KEY, JSON.stringify({
        catId: zhState.catId,
        pos: zhState.pos,
        correct: zhState.correct,
        total: zhState.total
      }));
    } catch (e) {}
  }

  function zhNorm(s) {
    return String(s == null ? '' : s).replace(/[\s\p{P}]/gu, '');
  }

  function zhPunctNorm(s) {
    return String(s == null ? '' : s).replace(/\s+/g, '')
      .replace(/[,]/g, '，').replace(/[.]/g, '。')
      .replace(/[?]/g, '？').replace(/[!]/g, '！')
      .replace(/[:]/g, '：').replace(/[;]/g, '；')
      .replace(/[“”"「」]/g, '"')
      .replace(/[‘’']/g, "'");
  }

  function zhShuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function zhCurrentCat() {
    for (var i = 0; i < ZH_GROUPS.length; i++) {
      for (var j = 0; j < ZH_GROUPS[i].subs.length; j++) {
        if (ZH_GROUPS[i].subs[j].id === zhState.catId) return ZH_GROUPS[i].subs[j];
      }
    }
    return ZH_GROUPS[0].subs[0];
  }

  function zhGroupStats() {
    var cat = zhCurrentCat();
    var p = zhState.pos[cat.id] || 0;
    var gs = zhState.groupStart;
    var size = Math.min(GROUP_SIZE, Math.max(0, cat.items.length - gs));
    var within = Math.min(Math.max(0, p - gs), size);
    if (zhState.finished && (zhState.doneKind === 'group' || zhState.doneKind === 'category')) within = size;
    return { start: gs, size: size, within: within };
  }

  function zhRenderChrome() {
    zhQuizEl.hidden = zhState.finished;
    zhDoneEl.hidden = !zhState.finished;

    var g = zhGroupStats();
    var no = Math.floor(g.start / GROUP_SIZE) + 1;
    if (g.size) {
      var shown = zhState.finished ? g.within : Math.min(g.within + 1, g.size);
      zhCounterEl.textContent = '第 ' + no + ' 组 · ' + shown + '/' + g.size;
    } else {
      zhCounterEl.textContent = '';
    }
    zhBarEl.style.width = (g.size ? Math.min(100, (g.within / g.size) * 100) : 0) + '%';

    var cat = zhCurrentCat();
    zhCatnameEl.textContent = cat.title;
    zhCathintEl.textContent = cat.hint;

    var pct = zhState.total ? Math.round(zhState.correct / zhState.total * 100) : 0;
    zhStatsEl.textContent = '答对 ' + zhState.correct + ' / ' + zhState.total + (zhState.total ? '（' + pct + '%）' : '');
  }

  function zhRenderDone() {
    if (zhState.doneKind === 'group') {
      var size = Math.min(GROUP_SIZE, zhCurrentCat().items.length - zhState.groupStart);
      zhDoneEmojiEl.textContent = '✅';
      zhDoneTitleEl.textContent = '这一组练完了';
      zhDoneTextEl.textContent = '这一组 ' + size + ' 题做完了。可以重做这一组，或者继续下一组。';
      zhAgainBtnEl.textContent = '重做这一组';
      zhNextBtnEl.textContent = '下一组';
      zhNextBtnEl.hidden = false;
      return;
    }
    var cat = zhCurrentCat();
    zhDoneEmojiEl.textContent = '🎉';
    zhDoneTitleEl.textContent = cat.title + ' 练完了';
    zhDoneTextEl.textContent = '这一类一共 ' + cat.items.length + ' 题。可以再练一遍，或者去下一类。';
    zhAgainBtnEl.textContent = '再练一遍';
    zhNextBtnEl.textContent = '下一类';
    zhNextBtnEl.hidden = false;
  }

  function zhItemMode(item, cat) {
    return item.mode || cat.mode || 'open';
  }

  function zhRenderOrder() {
    zhOrderAnswerEl.innerHTML = '';
    zhOrderBankEl.innerHTML = '';
    if (!zhState.order.picked.length) {
      var ph = document.createElement('span');
      ph.className = 'cathint';
      ph.textContent = '按顺序点下面的词语';
      zhOrderAnswerEl.appendChild(ph);
    }
    zhState.order.picked.forEach(function (w, idx) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'wordchip';
      chip.textContent = w;
      chip.addEventListener('click', function () {
        if (zhState.answered) return;
        zhState.order.picked.splice(idx, 1);
        var restored = false;
        for (var i = 0; i < zhState.order.bank.length; i++) {
          var b = zhState.order.bank[i];
          if (!restored && b.used && b.p === w) { b.used = false; restored = true; }
        }
        zhRenderOrder();
      });
      zhOrderAnswerEl.appendChild(chip);
    });
    zhState.order.bank.forEach(function (b) {
      if (b.used) return;
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'wordchip';
      chip.textContent = b.p;
      chip.addEventListener('click', function () {
        if (zhState.answered) return;
        b.used = true;
        zhState.order.picked.push(b.p);
        zhRenderOrder();
      });
      zhOrderBankEl.appendChild(chip);
    });
  }

  function zhRenderItem(item, cat) {
    var mode = zhItemMode(item, cat);
    zhPromptEl.textContent = item.prompt;
    zhFeedbackEl.innerHTML = '';

    if (mode === 'order') {
      zhInputEl.hidden = true;
      zhOrderEl.hidden = false;
      var parts = item.parts.slice();
      var answerNorm = zhNorm(item.answer);
      var guard = 0;
      do { zhShuffle(parts); guard++; } while (parts.join('') === answerNorm && guard < 6);
      zhState.order = { bank: parts.map(function (p) { return { p: p, used: false }; }), picked: [] };
      zhRenderOrder();
      return;
    }

    zhInputEl.hidden = false;
    zhOrderEl.hidden = true;
    zhState.order = null;
    zhInputEl.value = '';
    zhInputEl.readOnly = false;
    zhInputEl.rows = (mode === 'writing') ? 8 : 2;
    setTimeout(function () {
      if (zhInputEl.focus) zhInputEl.focus();
    }, 30);
  }

  function zhPrepare() {
    clearTimeout(zhAutoTimer);
    zhState.answered = false;
    zhState.finished = false;
    zhFeedbackEl.innerHTML = '';
    zhSubmitBtn.textContent = '检查';
    zhSubmitBtn.disabled = false;
    zhSkipBtn.disabled = false;
    zhSkipBtn.style.display = '';

    var cat = zhCurrentCat();
    var p = zhState.pos[cat.id] || 0;
    if (p >= cat.items.length) {
      zhState.current = null;
      zhState.finished = true;
      zhState.doneKind = 'category';
      zhSave();
      zhRenderDone();
      zhRenderChrome();
      return;
    }
    zhState.current = cat.items[p];
    zhState.groupStart = Math.floor(p / GROUP_SIZE) * GROUP_SIZE;
    zhRenderItem(zhState.current, cat);
    zhRenderChrome();
  }

  function zhShowFeedback(ok, item, cat) {
    zhFeedbackEl.innerHTML = '';
    var head = document.createElement('div');

    if (ok === null) {
      head.className = 'fb-ok';
      head.textContent = '参考写法：';
      zhFeedbackEl.appendChild(head);
      var ref = document.createElement('div');
      ref.className = 'answer';
      ref.style.fontWeight = '400';
      ref.textContent = item.answer;
      zhFeedbackEl.appendChild(ref);
    } else {
      head.className = ok ? 'fb-ok' : 'fb-bad';
      head.textContent = ok ? '✓ 正确' : '✗ 不太对，参考答案是：';
      zhFeedbackEl.appendChild(head);
      if (!ok) {
        var ans = document.createElement('div');
        ans.className = 'answer';
        ans.textContent = item.answer;
        zhFeedbackEl.appendChild(ans);
      }
    }

    zhSubmitBtn.textContent = '下一题';
    zhSkipBtn.style.display = 'none';

    if (ok === true) {
      clearTimeout(zhAutoTimer);
      zhAutoTimer = setTimeout(function () { if (zhState.answered) zhNext(); }, 1200);
    }
  }

  function zhReadAnswer() {
    return String(zhInputEl.value || '').trim();
  }

  function zhSubmit() {
    if (zhState.finished) return;
    if (zhState.answered) { zhNext(); return; }
    var item = zhState.current;
    var cat = zhCurrentCat();
    if (!item) return;

    var mode = zhItemMode(item, cat);
    var raw = (mode === 'order') ? '' : zhReadAnswer();
    if (mode !== 'order' && !raw) {
      toast('先写一写再检查');
      if (zhInputEl.focus) zhInputEl.focus();
      return;
    }

    var ok = null;

    if (mode === 'order') {
      if (!zhState.order || !zhState.order.picked.length) { toast('先按顺序点词'); return; }
      ok = (zhNorm(zhState.order.picked.join('')) === zhNorm(item.answer));
      zhState.total++;
      if (ok) zhState.correct++;
    } else if (mode === 'punct') {
      var up = zhPunctNorm(raw);
      ok = (zhPunctNorm(item.answer) === up);
      if (!ok && item.alts) {
        for (var j = 0; j < item.alts.length; j++) {
          if (zhPunctNorm(item.alts[j]) === up) { ok = true; break; }
        }
      }
      zhState.total++;
      if (ok) zhState.correct++;
    } else if (mode === 'strict') {
      var u = zhNorm(raw);
      ok = (zhNorm(item.answer) === u);
      if (!ok && item.alts) {
        for (var i = 0; i < item.alts.length; i++) {
          if (zhNorm(item.alts[i]) === u) { ok = true; break; }
        }
      }
      zhState.total++;
      if (ok) zhState.correct++;
    }

    zhState.answered = true;
    if (mode !== 'order') zhInputEl.readOnly = true;
    zhSave();
    zhRenderChrome();
    zhShowFeedback(ok, item, cat);
  }

  function zhSkip() {
    if (zhState.answered || zhState.finished || !zhState.current) return;
    var item = zhState.current;
    var cat = zhCurrentCat();
    var mode = zhItemMode(item, cat);
    if (mode === 'strict' || mode === 'punct' || mode === 'order') zhState.total++;
    zhState.answered = true;
    if (mode !== 'order') zhInputEl.readOnly = true;
    zhSave();
    zhRenderChrome();
    zhShowFeedback((mode === 'strict' || mode === 'punct' || mode === 'order') ? false : null, item, cat);
  }

  function zhNext() {
    clearTimeout(zhAutoTimer);
    zhState.answered = false;
    var cat = zhCurrentCat();
    var p = (zhState.pos[cat.id] || 0) + 1;
    zhState.pos[cat.id] = p;
    zhSave();
    if (p >= cat.items.length) {
      zhState.current = null;
      zhState.finished = true;
      zhState.doneKind = 'category';
      zhRenderDone();
      zhRenderChrome();
      return;
    }
    if (p % GROUP_SIZE === 0) {
      zhState.finished = true;
      zhState.doneKind = 'group';
      zhRenderDone();
      zhRenderChrome();
      return;
    }
    zhPrepare();
  }

  function zhRedo() {
    var cat = zhCurrentCat();
    zhState.pos[cat.id] = zhState.groupStart;
    zhState.finished = false;
    zhState.doneKind = '';
    zhPrepare();
    toast('重做这一组');
  }

  function zhSwap() {
    var cat = zhCurrentCat();
    var groups = Math.ceil(cat.items.length / GROUP_SIZE);
    if (groups < 2) { toast('这一类只有一组'); return; }
    var cur = Math.floor((zhState.pos[cat.id] || 0) / GROUP_SIZE);
    var g = Math.floor(Math.random() * groups);
    var guard = 0;
    while (g === cur && guard < 30) { g = Math.floor(Math.random() * groups); guard++; }
    zhState.pos[cat.id] = g * GROUP_SIZE;
    zhState.groupStart = g * GROUP_SIZE;
    zhState.finished = false;
    zhState.doneKind = '';
    zhPrepare();
    toast('换了一组');
  }

  function zhAgain() {
    var cat = zhCurrentCat();
    if (zhState.doneKind === 'group') {
      zhState.pos[cat.id] = zhState.groupStart;
    } else {
      zhState.pos[cat.id] = 0;
      zhState.groupStart = 0;
    }
    zhState.finished = false;
    zhState.doneKind = '';
    zhSave();
    zhPrepare();
  }

  function zhNextGroup() {
    if (zhState.doneKind === 'group') {
      zhState.finished = false;
      zhState.doneKind = '';
      zhPrepare();
      return;
    }
    var cats = [];
    ZH_GROUPS.forEach(function (g) { g.subs.forEach(function (s) { cats.push(s); }); });
    var idx = cats.indexOf(zhCurrentCat());
    if (idx < 0 || idx >= cats.length - 1) { toast('已经是最后一类了'); return; }
    zhState.catId = cats[idx + 1].id;
    zhState.groupStart = 0;
    zhState.finished = false;
    zhState.doneKind = '';
    zhSave();
    zhPrepare();
  }

  function zhSelectCat(id) {
    zhState.catId = id;
    zhState.finished = false;
    zhState.doneKind = '';
    zhState.groupStart = 0;
    zhState.answered = false;
    zhSave();
    closePicker();
    zhPrepare();
  }

  function setSubject(s) {
    subject = s;
    appEnEl.hidden = (s !== 'en');
    appZhEl.hidden = (s !== 'zh');
    if (sheetEl && !sheetEl.hidden) closePicker();
    if (s === 'zh') {
      if (!zhState.current && !zhState.finished) zhPrepare();
      else zhRenderChrome();
    }
  }

  function showHome() {
    homeEl.hidden = false;
    subjectbarEl.hidden = true;
    appEnEl.hidden = true;
    appZhEl.hidden = true;
    if (sheetEl && !sheetEl.hidden) closePicker();
  }

  function enterSubject(s) {
    homeEl.hidden = true;
    subjectbarEl.hidden = false;
    setSubject(s);
  }

  homeEnEl.addEventListener('click', function () { enterSubject('en'); });
  homeZhEl.addEventListener('click', function () { enterSubject('zh'); });
  homeBtnEl.addEventListener('click', showHome);

  zhPickerBtnEl.addEventListener('click', openPicker);
  zhRedoBtnEl.addEventListener('click', zhRedo);
  zhSwapBtnEl.addEventListener('click', zhSwap);
  zhSubmitBtn.addEventListener('click', zhSubmit);
  zhSkipBtn.addEventListener('click', zhSkip);
  zhAgainBtnEl.addEventListener('click', zhAgain);
  zhNextBtnEl.addEventListener('click', zhNextGroup);

  zhInputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !composing) {
      var cat = zhCurrentCat();
      var mode = zhState.current ? zhItemMode(zhState.current, cat) : cat.mode;
      if (mode !== 'writing') {
        e.preventDefault();
        zhSubmit();
      }
    }
  });

  var zhTouchX = 0, zhTouchY = 0, zhTouchOk = false;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    if (sheetEl && !sheetEl.hidden) return;
    zhTouchX = e.touches[0].clientX;
    zhTouchY = e.touches[0].clientY;
    zhTouchOk = true;
  }, { passive: true });

  document.addEventListener('touchend', function (e) {
    if (!zhTouchOk) return;
    zhTouchOk = false;
    var dx = e.changedTouches[0].clientX - zhTouchX;
    var dy = e.changedTouches[0].clientY - zhTouchY;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx > 0 && subject === 'en') setSubject('zh');
    else if (dx < 0 && subject === 'zh') setSubject('en');
  }, { passive: true });

  prepare();
  showHome();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!hadController) return;
    window.location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      if (reg.update) reg.update();
    }).catch(function(){});
  });
}
</script>
